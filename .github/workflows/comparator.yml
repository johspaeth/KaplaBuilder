# Comparator: checks that the proofs prove exactly the statements in specs/.
# Disabled in the merge gate (see README, "Rules for main"). Run it by hand at the very end:
# Actions -> Comparator -> Run workflow.
name: Comparator

on:
  workflow_dispatch:

env:
  # Outside $HOME: the `lake comparator` sandbox hides home directories.
  ELAN_HOME: /opt/elan

jobs:
  comparator:
    name: Comparator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lean
        with:
          cache-name: comparator
      - name: Install sandbox (bubblewrap)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: lake comparator (proofs prove exactly the specs)
        run: |
          shopt -s nullglob
          for cfg in comparator/*.json; do
            echo "::group::comparator $cfg"
            lake comparator --config "$cfg"
            echo "::endgroup::"
          done
