# KaplaBuilder: one Lake workspace, one folder per component.
# Each component is its own library, so each can be built alone:
#   lake build KaplaPhysics
# See README.md for the rules (who may import what, what CI checks).
name = "KaplaBuilder"
version = "0.1.0"
# Everything except the spec challenges (they contain `sorry` on purpose).
defaultTargets = ["KaplaCore", "KaplaPhysics", "KaplaSemantics", "KaplaPlanner", "KaplaWeb", "kapla"]
testDriver = "tests"


[leanOptions]
autoImplicit = false

# Proofs use Mathlib tactics (linarith, ring, nlinarith, field_simp, positivity).
# NOTE: CLAUDE.md says "no Mathlib"; this PR asks the team to decide (see PR description).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

# Shared contract: types, JSON, basic geometry, engine interfaces, mocks.
[[lean_lib]]
name = "KaplaCore"
srcDir = "core"
globs = ["KaplaCore.*"]

# A: Physics engine.
[[lean_lib]]
name = "KaplaPhysics"
srcDir = "physics"
globs = ["KaplaPhysics.*"]

# B: Semantic engine.
[[lean_lib]]
name = "KaplaSemantics"
srcDir = "semantics"
globs = ["KaplaSemantics.*"]

# C: Construction planner.
[[lean_lib]]
name = "KaplaPlanner"
srcDir = "planner"
globs = ["KaplaPlanner.*"]

# D: Web and integration.
[[lean_lib]]
name = "KaplaWeb"
srcDir = "web"
globs = ["KaplaWeb.*"]

# Human-owned theorem statements, checked with `lake comparator`.
[[lean_lib]]
name = "KaplaSpecs"
srcDir = "specs"
globs = ["KaplaSpecs.+"]

# D: the CLI, the only place where the real engines meet.
[[lean_exe]]
name = "kapla"
srcDir = "app"
root = "Main"

# Contract tests against fixtures/ (`lake test`).
[[lean_lib]]
name = "KaplaTests"
srcDir = "tests"
globs = ["KaplaTests.*"]

[[lean_exe]]
name = "tests"
srcDir = "tests"
root = "KaplaTests.Main"
